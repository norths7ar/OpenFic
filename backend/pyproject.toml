[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfic"
version = "0.10.2"
description = "An AI-native, cross-platform writing tool for fiction authors."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Syrize", email = "syrize@qq.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
urls = { Homepage = "https://github.com/syrizelink/OpenFic", Repository = "https://github.com/syrizelink/OpenFic" }
dependencies = [
    "aiocache>=0.12.3",
    "aiofiles>=22.0",
    "aiosqlite>=0.22.0",
    "alembic>=1.17.2",
    "argon2-cffi>=25.1.0",
    "charset-normalizer>=3.4.7",
    "cryptography>=46.0.3",
    "fastapi>=0.127.0",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.21.0",
    "itsdangerous>=2.2.0",
    "json-repair>=0.60.1",
    "lancedb>=0.26.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.8",
    "langgraph-checkpoint-sqlite>=3.0.5",
    "loguru>=0.7.3",
    "nanoid>=2.0.0",
    "pillow>=8.0,<12.0",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.2",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.21",
    "python-socketio[asgi]>=5.11.0",
    "pyyaml>=6.0.2",
    "pyzmq>=27.1.0",
    "sqlalchemy>=2.0.45",
    "sqlmodel>=0.0.27",
    "starlette-compress>=1.6.1",
    "tiktoken>=0.12.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.40.0",
    "fastembed>=0.8.0",
    "pypinyin>=0.55.0",
]

[project.optional-dependencies]
amazon-nova = ["langchain-amazon-nova>=1.0.1"]
anthropic = ["langchain-anthropic>=1.3.1"]
cohere = ["langchain-cohere>=0.5.1"]
deepseek = ["langchain-deepseek>=1.0.1"]
google-genai = ["langchain-google-genai>=4.1.3"]
groq = ["langchain-groq>=1.1.2"]
mistral = ["langchain-mistralai>=1.1.1"]
nvidia = ["langchain-nvidia-ai-endpoints>=1.4.0"]
openrouter = ["langchain-openrouter>=0.2.3"]

[project.scripts]
openfic = "app.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "python-socketio[asyncio-client]>=5.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.10",
    "ty>=0.0.56",
    "types-nanoid>=2.0.0.20260508",
    "types-pyyaml>=6.0.12.20260510",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"
"LICENSE" = "LICENSE"
"frontend" = "frontend"

[tool.hatch.build.targets.sdist]
force-include = { "alembic.ini" = "alembic.ini", "../LICENSE" = "LICENSE", "frontend" = "frontend", "app/skills" = "app/skills" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/api/routers/*.py" = ["B008"]
"tests/**/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
filterwarnings = [
    "ignore::DeprecationWarning:langchain_community.*",
    "ignore::DeprecationWarning:langchain_cohere.*",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["lancedb"]

target-version = "py314"
line-length = 100
indent-width = 4
extend-exclude = [".tmp", "output", "backend/app/storage/migrations/versions"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
extend-select = ["RUF012"]

[lint.isort]
known-first-party = ["app", "service"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
